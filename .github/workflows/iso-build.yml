# Tek mimari için ISO derlemesi (iso.yml tarafından çağrılır).
name: ISO (derleme)

on:
  workflow_call:
    secrets:
      COPR_KEY_SHA256:
        required: false
    inputs:
      arch: { type: string, required: true }
      runner: { type: string, required: true }
      fedora: { type: string, required: false, default: "" }

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Açık anahtar özetinin yapılandırıldığını denetle
        env:
          COPR_KEY_SHA256: ${{ vars.COPR_KEY_SHA256 || secrets.COPR_KEY_SHA256 }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          if not re.fullmatch(r'[0-9a-fA-F]{64}', os.environ.get('COPR_KEY_SHA256', '')):
              raise SystemExit('COPR_KEY_SHA256: Variable veya Secret içinde 64 haneli SHA-256 gerekli.')
          PYTHON

      - name: Sürüm yayını için gerçek test kaydını denetle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VABU_VALIDATION_RECORD: ${{ vars.RELEASE_VALIDATION_JSON }}
          SOURCE: ${{ github.sha }}
          ARCH: ${{ inputs.arch }}
          REQUESTED_FEDORA: ${{ inputs.fedora }}
        run: |
          fedora="${REQUESTED_FEDORA:-$(cat FEDORA_VERSION)}"
          python3 -B tools/validate-release.py "$SOURCE" "$ARCH" "$fedora"

      - name: Disk alanı aç
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Sürüm ve mimariyi yerleştir
        env:
          REQUESTED_FEDORA: ${{ inputs.fedora }}
        run: |
          fedora="$REQUESTED_FEDORA"
          [[ -z "$fedora" ]] && fedora="$(cat FEDORA_VERSION)"
          [[ "$fedora" =~ ^[0-9]+$ ]] || { echo "Geçersiz Fedora sürümü"; exit 1; }
          mkdir -p iso/root/usr/share/vabu
          git rev-parse HEAD > iso/root/usr/share/vabu/expected-source-commit
          echo "FEDORA=${fedora}" >> "$GITHUB_ENV"
          sed -i "s/@FEDORA@/${fedora}/g; s/@ARCH@/${{ inputs.arch }}/g" iso/config.kiwi
          grep -n "@" iso/config.kiwi | grep -v "xml\|@FEDORA\|@ARCH" || true

      - name: Kiwi ile ISO üret
        env:
          COPR_KEY_SHA256: ${{ vars.COPR_KEY_SHA256 || secrets.COPR_KEY_SHA256 }}
        run: |
          sudo --preserve-env=COPR_KEY_SHA256,FEDORA podman run --rm --privileged \
            -v "$PWD":/work:Z -v /dev:/dev -w /work -e COPR_KEY_SHA256 -e FEDORA \
            registry.fedoraproject.org/fedora:${FEDORA} \
            bash -euxc '
              dnf -y install python3 distribution-gpg-keys kiwi-cli kiwi-systemdeps-iso-media kiwi-systemdeps-bootloaders
              python3 tools/prepare-iso-keys.py /work/iso "$FEDORA"
              kiwi-ng system build --description /work/iso --target-dir /work/out
            '
          name="vabu-$(cat VERSION)-fedora${FEDORA}-${{ inputs.arch }}-$(date -u +%Y%m%d-%H%M).iso"
          sudo mv out/*.iso "$name"
          sudo chown "$(id -u)" "$name"
          sha256sum "$name" > "$name.sha256"
          ls -lh "$name"

      - name: Kiwi günlüğü (hata olursa)
        if: failure()
        run: sudo find out -name '*.log' -exec tail -n 200 {} \; || true

      - name: İmzalı kaynak doğrulaması
        id: provenance
        if: ${{ !github.event.repository.private || vars.PRIVATE_ATTESTATIONS_ENABLED == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: vabu-*.iso

      - name: Doğrulama belgesini sakla
        if: steps.provenance.outcome == 'success'
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp -- "$BUNDLE" "vabu-${{ inputs.arch }}.sigstore.json"

      - name: İmzasız sürüm yayınını durdur
        if: startsWith(github.ref, 'refs/tags/v') && steps.provenance.outcome != 'success'
        run: |
          echo "::error::Sürüm yayını için imzalı kaynak doğrulaması gerekli. Özel depoda desteklenen GitHub planını doğrula."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: vabu-iso-${{ inputs.arch }}
          path: |
            vabu-*.iso
            vabu-*.sha256
            vabu-*.sigstore.json
          retention-days: 7
          compression-level: 0

      - name: Sürüme ekle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" vabu-*.iso vabu-*.sha256 vabu-*.sigstore.json --clobber || gh release create "${GITHUB_REF_NAME}" vabu-*.iso vabu-*.sha256 vabu-*.sigstore.json --title "Vabu ${GITHUB_REF_NAME}" --generate-notes
