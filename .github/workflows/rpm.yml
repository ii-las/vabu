# Vabu RPM paketleri (vabu-*): her PR'da Fedora container'ında derlenip doğrulanır,
# main'e push'ta kaynak paketler (SRPM) COPR'a gönderilir ve orada x86_64 + aarch64 derlenir.
# Quickshell ayrı workflow'da (quickshell.yml): uzun sürdüğü için sadece değişince derlenir.
name: RPM

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "packaging/quickshell.spec", ".github/workflows/quickshell.yml"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_copr:
        description: "Bu dalın doğrulanan paketlerini COPR'a gönder"
        type: boolean
        default: false
      copr_arch:
        description: "Elle COPR gönderiminin hedef mimarisi"
        type: choice
        default: both
        options: [both, aarch64, x86_64]

jobs:
  target:
    runs-on: ubuntu-24.04
    outputs:
      fedora: ${{ steps.version.outputs.fedora }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          fedora="$(cat FEDORA_VERSION)"
          [[ "$fedora" =~ ^[0-9]+$ ]] || exit 1
          echo "fedora=$fedora" >> "$GITHUB_OUTPUT"

  build:
    needs: target
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:${{ needs.target.outputs.fedora }}
    steps:
      - name: Araçlar
        run: dnf -y install python3 nodejs git rpm-build rpmdevtools rpmlint dnf-plugins-core librsvg2-tools systemd-rpm-macros copr-cli tar

      - uses: actions/checkout@v4

      - name: Yerel güvenilirlik testleri
        run: |
          python3 -B tests/reliability.py
          python3 -B tests/desktop.py
          python3 -B tests/stability.py
          python3 -B tests/expansion.py
          python3 -B tests/recovery.py
          python3 -B tests/iso-setup.py

      - name: Kaynak arşivleri
        run: |
          git config --global --add safe.directory "$PWD"
          ver="$(cat VERSION)"
          rpmdev-setuptree
          git archive --format=tar.gz --prefix="vabu-${ver}/" -o ~/rpmbuild/SOURCES/vabu-${ver}.tar.gz HEAD LICENSE rootfs branding shell shell-system
          # Her derleme yeni bir Release alır (ör. 1.202611160012) ki kurulu sistemlere güncelleme olarak gitsin
          rel="1.$(date -u +%Y%m%d%H%M)"
          for s in vabu-release vabu-desktop vabu-shell; do
            sed -i "s/^Version:.*/Version:        ${ver}/; s/^Release:.*/Release:        ${rel}%{?dist}/" packaging/$s.spec
            sed -i "1i%global vabu_source_commit ${GITHUB_SHA}" packaging/$s.spec
          done
          sed -i "s/^Release:.*/Release:        ${rel}%{?dist}/" packaging/vabu-fonts.spec
          sed -i "s/^%global copr_owner .*/%global copr_owner $(cat COPR_OWNER)/" packaging/vabu-release.spec
          # Dış kaynaklar (Quickshell, yazı tipleri)
          for spec in packaging/vabu-*.spec; do spectool -g -R "$spec"; done

      - name: Lint
        run: rpmlint packaging/*.spec || true

      - name: Derle
        run: |
          for spec in packaging/vabu-fonts.spec packaging/vabu-release.spec packaging/vabu-desktop.spec packaging/vabu-shell.spec; do
            dnf -y builddep "$spec"
            rpmbuild -ba "$spec"
          done
          ls -R ~/rpmbuild/RPMS ~/rpmbuild/SRPMS

      - name: Paket içeriğini kontrol et
        run: |
          rpm -qlp ~/rpmbuild/RPMS/noarch/vabu-desktop-*.rpm | grep -q /usr/bin/vabu-drivers
          rpm -qlp ~/rpmbuild/RPMS/noarch/vabu-shell-*.rpm | grep -q /usr/share/vabu/shell/shell.qml
          rpm -qlp ~/rpmbuild/RPMS/noarch/vabu-shell-*.rpm | grep -q /usr/share/vabu/shell/greeter.qml
          rpm -qp --provides ~/rpmbuild/RPMS/noarch/vabu-release-*.rpm | grep -q system-release
          rpm -qlp ~/rpmbuild/RPMS/noarch/vabu-shell-*.rpm | grep -q /usr/share/vabu/shell/settings.qml
          rpm -qlp ~/rpmbuild/RPMS/noarch/vabu-desktop-*.rpm | grep -q /boot/grub2/themes/vabu/theme.txt
          rpm -qlp ~/rpmbuild/RPMS/noarch/vabu-desktop-*.rpm | grep -q /boot/grub2/themes/vabu/vabu-22.pf2
          rpm -qlp ~/rpmbuild/RPMS/noarch/vabu-desktop-*.rpm | grep -q /usr/share/vabu/assets/wallpaper-gunduz.jpg
          rpm -qlp ~/rpmbuild/RPMS/noarch/vabu-desktop-*.rpm | grep -q /usr/libexec/vabu/app-index

      - name: Paketleri gerçekten kur (dosya çakışması, eksik bağımlılık)
        run: |
          v="$(rpm -E %fedora)"
          dnf -y install \
            "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-${v}.noarch.rpm" \
            "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-${v}.noarch.rpm"
          dnf -y copr enable "$(cat COPR_OWNER)/vabu"
          dnf -y install --allowerasing --setopt=protected_packages= ~/rpmbuild/RPMS/noarch/*.rpm
          rpm -q vabu-release vabu-desktop vabu-shell vabu-fonts quickshell
          niri validate -c /etc/niri/config.kdl
          foot -c /usr/share/vabu/xdg/foot/foot.ini --check-config
          for f in "Hanken Grotesk" "Material Symbols Rounded" "JetBrains Mono"; do
            fc-list : family | grep -q "$f" || { echo "::error::yazı tipi eksik: $f"; exit 1; }
          done

      - name: QML denetimi (qmllint)
        # Static lint runs before the longer runtime scenarios; both remain mandatory.
        run: |
          dnf -y install qt6-qtdeclarative-devel
          QMLLINT=$(command -v qmllint-qt6 || echo /usr/lib64/qt6/bin/qmllint)
          # Quickshell qmldir'i çalışırken üretir; qmllint singleton'ları tanısın diye burada üret
          cp -r shell /tmp/lint && cd /tmp/lint
          for f in *.qml; do
            n="${f%.qml}"
            case "$n" in [A-Z]*) ;; *) continue ;; esac
            if grep -q "^pragma Singleton" "$f"; then echo "singleton $n 1.0 $f"; else echo "$n 1.0 $f"; fi
          done > qmldir
          set +e
          "$QMLLINT" --unqualified disable -I /usr/lib64/qt6/qml -I . *.qml > /tmp/qmllint.txt 2>&1
          lint_status=$?
          set -e
          mkdir -p /tmp/ekran
          cp /tmp/qmllint.txt /tmp/ekran/qmllint.log
          cat /tmp/qmllint.txt
          exit "$lint_status"

      - name: Kabuğu çalıştır ve ekran görüntülerini al
        timeout-minutes: 15
        run: |
          dnf -y install sway grim wtype mesa-dri-drivers dbus-daemon libnotify pipewire wireplumber procps-ng findutils calamares
          VABU_TEST_ISOLATED=1 bash tests/ekran.sh /tmp/ekran

      - name: Önyükleme menüsünün görüntüsünü al
        timeout-minutes: 8
        run: |
          dnf -y install qemu-system-x86-core edk2-ovmf grub2-tools-extra grub2-efi-x64-modules mtools ImageMagick python3
          bash tests/grub-ekran.sh /tmp/ekran

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekran
          path: /tmp/ekran
          if-no-files-found: ignore

      - name: niri ayarlarını doğrula
        run: |
          dnf -y install niri jq perl-interpreter
          export VABU_NIRI_TEMPLATE=rootfs/usr/share/vabu/niri/config.kdl.in
          bash rootfs/usr/libexec/vabu/niri-config --defaults -o /tmp/varsayilan.kdl
          niri validate -c /tmp/varsayilan.kdl
          # Tüm seçenekler dolu bir örnek de geçerli olmalı
          mkdir -p /tmp/h/vabu
          echo '{"xkbLayout":"tr,us","xkbVariant":"f,","xkbOptions":"grp:caps_toggle","naturalScroll":false,"gaps":20,"radius":0,"animations":false,
                 "outputs":[{"name":"DP-1","mode":"2560x1440@165.000","scale":1.25,"x":0,"y":0,"vrr":true},{"name":"HDMI-A-1","off":true}]}' > /tmp/h/vabu/niri.json
          echo '{"accent":"seftali"}' > /tmp/h/vabu/shell.json
          XDG_CONFIG_HOME=/tmp/h bash rootfs/usr/libexec/vabu/niri-config
          niri validate -c /tmp/h/niri/config.kdl
          niri validate -c shell-system/usr/share/vabu/greeter/niri.kdl
          niri validate -c rootfs/usr/share/vabu/recovery/niri.kdl

      - uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: |
            ~/rpmbuild/RPMS/*/*.rpm
            ~/rpmbuild/SRPMS/*.rpm

      - name: COPR'a gönder
        shell: bash
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.publish_copr))
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_ARCH: ${{ inputs.copr_arch || 'both' }}
        run: |
          if [[ -z "${COPR_CONFIG}" ]]; then
            echo "::error::COPR_CONFIG tanımlı değil; istenen paket gönderimi yapılamaz."
            exit 1
          fi
          args=()
          case "$COPR_ARCH" in
            both) ;;
            aarch64|x86_64) args+=(--chroot "fedora-$(cat FEDORA_VERSION)-${COPR_ARCH}") ;;
            *) echo "::error::Geçersiz COPR mimarisi"; exit 1 ;;
          esac
          umask 077
          trap 'rm -f -- "$HOME/.config/copr"' EXIT
          mkdir -p ~/.config && printf '%s' "${COPR_CONFIG}" > ~/.config/copr
          owner="$(cat COPR_OWNER)"
          for srpm in ~/rpmbuild/SRPMS/vabu-*.src.rpm; do
            copr-cli build "${args[@]}" "${owner}/vabu" "$srpm"
          done
