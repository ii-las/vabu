# Vabu terminal teması (foot). XDG_CONFIG_DIRS ile okunur; kendi ayarın için: ~/.config/foot/foot.ini
[main]
font=JetBrains Mono:size=11
pad=18x16
initial-window-size-chars=96x28

[cursor]
style=beam
beam-thickness=1.6
blink=yes

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000

[colors-dark]
alpha=1.0
background=202420
foreground=f0eee9
selection-background=edeae3
selection-foreground=141316
cursor=141316 edeae3
regular0=2a272d
regular1=e0948a
regular2=9fd0a8
regular3=dcb27d
regular4=9fb3d8
regular5=d3a3be
regular6=93c6c0
regular7=c9c4bb
bright0=6f6b66
bright1=eeb0a7
bright2=bde3c4
bright3=ecc99c
bright4=bccbe8
bright5=e4c0d4
bright6=b3dcd6
bright7=edeae3
