# Vabu terminal teması (foot). XDG_CONFIG_DIRS ile okunur; kendi ayarın için: ~/.config/foot/foot.ini
[main]
font=Geist Mono:size=11
pad=16x14
dpi-aware=yes

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[colors]
alpha=0.96
background=121216
foreground=f3f1ec
selection-background=a9c7f7
selection-foreground=14243f
regular0=26242c
regular1=f7a8a8
regular2=8ef0c6
regular3=f2b48a
regular4=a9c7f7
regular5=f7a8c4
regular6=8ee8e0
regular7=cfc9c2
bright0=5c5b63
bright1=fbc4c4
bright2=b5f7dc
bright3=f8cfaf
bright4=c9dcfa
bright5=fac6da
bright6=b8f2ec
bright7=f3f1ec
