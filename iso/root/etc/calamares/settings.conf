# Vabu kurulumu (Calamares). Görsel tasarım
# Hesap adımı yerleşik Qt Widgets users modülüdür: Qt 6 / Wayland üzerinde
# gömülü QML penceresinin odak sorununa bağımlı olmadan fare ve klavye girişi alır.
# Diğer *q modülleri Vabu QML ekranlarıdır; yoksa config.sh widget karşılığına geçer.
modules-search: [ local, /usr/lib64/calamares/modules ]

# Önyükleyiciden sonra çekirdek satırını yenilemek için ikinci bir shellprocess
instances:
  - id: bls
    module: shellprocess
    config: shellprocess_bls.conf

sequence:
  - show:
      - welcomeq
      - locale
      - keyboard
      - partition
      - users
      - summaryq
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - dracutlukscfg
      - removeuser
      - users
      - networkcfg
      - hwclock
      - shellprocess
      - services-systemd
      - dracut
      - grubcfg
      - bootloader
      - shellprocess@bls
      - umount
  - show:
      - finishedq

branding: vabu
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
hide-back-and-next-during-exec: true
