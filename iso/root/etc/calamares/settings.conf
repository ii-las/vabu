# Vabu kurulumu (Calamares). Görsel tasarım
# *q modülleri Vabu'nun QML ekranlarıdır (branding/vabu/*.qml). Kurulu Calamares bu modülleri
# içermiyorsa iso/config.sh derleme sırasında klasik (widget) karşılıklarına geçer.
modules-search: [ local, /usr/lib64/calamares/modules ]

sequence:
  - show:
      - welcomeq
      - locale
      - keyboard
      - partition
      - usersq
      - summaryq
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - removeuser
      - shellprocess
      - services-systemd
      - dracut
      - bootloader
      - umount
  - show:
      - finishedq

branding: vabu
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
hide-back-and-next-during-exec: true
