defaultGroups:
  - name: wheel
    must_exist: true
    system: true
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: false
doReusePassword: false
passwordRequirements:
  minLength: 6
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root, liveuser ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "vabu-${cpu}"
