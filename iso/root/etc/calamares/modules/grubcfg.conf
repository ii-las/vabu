overwrite: false
keepDistributor: false
prefer_grub_d: false
defaults:
  GRUB_TIMEOUT: 3
  GRUB_DEFAULT: "saved"
  GRUB_DISABLE_SUBMENU: true
  GRUB_TERMINAL_OUTPUT: "gfxterm"
  GRUB_GFXMODE: "auto"
  GRUB_THEME: "/boot/grub2/themes/vabu/theme.txt"
  GRUB_DISABLE_RECOVERY: true
always_use_defaults: false
