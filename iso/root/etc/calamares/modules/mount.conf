extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

# Fedora ile aynı alt hacim adları; /var/log ayrı tutulur ki geri alma noktaları günlükleri silmesin.
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /root
  - mountPoint: /home
    subvolume: /home
  - mountPoint: /var/log
    subvolume: /var/log

mountOptions:
  - filesystem: default
    options: [ defaults ]
  - filesystem: btrfs
    options: [ defaults, "compress=zstd:1" ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
