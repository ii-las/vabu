efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 600M
userSwapChoices: [ none, file ]
initialSwapChoice: none
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]
# Fedora ile aynı btrfs düzeni; snapper kök alt hacmi için geri alma noktası tutar.
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /root
  - mountPoint: /home
    subvolume: /home
  - mountPoint: /var/log
    subvolume: /var/log
enableLuksAutomatedPartitioning: true
