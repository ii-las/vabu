efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 600MiB
userSwapChoices: [ none, file ]
initialSwapChoice: none
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4" ]
enableLuksAutomatedPartitioning: true

# Fedora düzeni: şifrelenmeyen ayrı /boot (ext4) + btrfs kök.
# Kök şifrelendiğinde imzalı grub /boot'u okuyabilsin diye /boot ayrı tutulur.
partitionLayout:
  - name: "boot"
    filesystem: "ext4"
    mountPoint: "/boot"
    size: 1GiB
  - name: "root"
    filesystem: "btrfs"
    mountPoint: "/"
    size: 100%
