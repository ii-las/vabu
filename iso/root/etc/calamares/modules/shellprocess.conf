# Canlı oturuma özel ayarları kurulan sistemden temizle.
dontChroot: false
timeout: 120
script:
  - "cp -f /usr/share/vabu/greetd/vabu.toml /etc/greetd/vabu.toml"
  - "rm -f /etc/sudoers.d/10-liveuser"
  - "systemctl enable vabu-flatpak-setup.service vabu-update.timer vabu-snapper-setup.service"
  - "plymouth-set-default-theme vabu"
  # Kopyalanan dosyaların SELinux etiketleri ilk açılışta yenilensin
  - "touch /.autorelabel"
